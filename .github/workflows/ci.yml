name: ci
on:
  push:
  pull_request:
jobs:
  test-build:
    runs-on: [self-hosted, linux, x64, pve-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
